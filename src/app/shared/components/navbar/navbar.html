<header class="nav-shell">
  <div class="nav container">
    <a routerLink="/" (click)="scrollToSection('top', $event)" style="text-decoration: none; color: inherit; display: flex; align-items: center;"><app-brand-mark /></a>
    <nav class="nav__links" [class.is-open]="menuOpen">
      <a routerLink="/" fragment="works" (click)="scrollToSection('works', $event)">{{ locale.locale() === 'ar' ? 'الأعمال' : 'Works' }}</a>
      <a routerLink="/" fragment="about" (click)="scrollToSection('about', $event)">{{ locale.locale() === 'ar' ? 'عن الفنان' : 'About' }}</a>
      <a routerLink="/" fragment="courses" (click)="scrollToSection('courses', $event)">{{ locale.locale() === 'ar' ? 'الدورات' : 'Courses' }}</a>
      <a routerLink="/" fragment="contact" (click)="scrollToSection('contact', $event)">{{ locale.locale() === 'ar' ? 'تواصل' : 'Contact' }}</a>
    </nav>
    <div class="nav__actions">
      <button class="icon-btn" (click)="theme.toggle()" [attr.aria-label]="theme.dark() ? 'Light mode' : 'Dark mode'">{{ theme.dark() ? '☼' : '◐' }}</button>
      <button class="locale-btn" (click)="toggleLocale()">{{ locale.locale() === 'en' ? 'عربي' : 'EN' }}</button>
      <button class="menu-btn art-toggle-btn" (click)="menuOpen = !menuOpen" [attr.aria-label]="locale.locale() === 'ar' ? 'قائمة المعرض' : 'Gallery Menu'" [title]="locale.locale() === 'ar' ? 'قائمة المعرض' : 'Gallery Menu'">
        @if (!menuOpen) {
          <svg class="art-palette-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2C6.5 2 2 6.5 2 12c0 3.6 2.1 6.7 5.2 8.2.4.2.8-.1.8-.5v-.7c0-.8.7-1.5 1.5-1.5h1.8c4 0 7.2-3.2 7.2-7.2C18.5 5.7 15.6 2 12 2z"/>
            <circle cx="7.5" cy="10.5" r="1.1" fill="currentColor"/>
            <circle cx="10.5" cy="7.5" r="1.1" fill="currentColor"/>
            <circle cx="14.5" cy="8" r="1.1" fill="currentColor"/>
            <circle cx="16" cy="11.5" r="1.1" fill="currentColor"/>
            <path d="M19 14.5l3.5 3.5c.4.4.4 1 0 1.4l-.6.6c-.4.4-1 .4-1.4 0L17 16.5"/>
          </svg>
        } @else {
          <span class="art-close-glyph">✕</span>
        }
      </button>
    </div>
  </div>
</header>
